name: 🔍 Проверка актуальности законов

on:
  schedule:
    - cron: '0 10 * * 0' # Каждое воскресенье в 10:00 UTC (13:00 Москва)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# ⚠️ Используем Node.js 24 для отсутствия предупреждений
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-sources:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4
      
      - name: Проверка доступности источников (Контур)
        id: check
        run: |
          echo "🔍 Проверка источника: normativ.kontur.ru..."
          
          # ПРОВЕРЯЕМ KONTUR.RU ВМЕСТО PRAVO.GOV.RU
          if curl -s --head --request GET --max-time 30 "https://normativ.kontur.ru" > /dev/null; then
            echo "✅ normativ.kontur.ru доступен"
            echo "SOURCE_STATUS=up" >> $GITHUB_ENV
          else
            echo "❌ normativ.kontur.ru недоступен"
            echo "SOURCE_STATUS=down" >> $GITHUB_ENV
          fi
      
      - name: Создание Issue для проверки
        if: env.SOURCE_STATUS == 'up'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const today = new Date().toISOString().split('T')[0];
            
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['legal-update', 'auto-check']
            });
            
            // Не создаем дубликаты за сегодня
            const duplicate = existingIssues.data.find(i => i.title.includes(`Проверка источников от ${today}`));
            
            if (duplicate) {
              console.log('ℹ️ Отчет за сегодня уже есть');
              return;
            }
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `✅ Источники доступны (${today})`,
              body: `## 🤖 Еженедельный отчет\n\n` +
                    `**Дата:** ${today}\n\n` +
                    `✅ Сервис **normativ.kontur.ru** работает стабильно.\n\n` +
                    `### 📝 Что делать дальше:\n` +
                    `1. Перейдите в раздел [ИIssues](https://github.com/${context.repo.owner}/${context.repo.repo}/issues) и найдите задачи с меткой \`manual-check\`, если они есть.\n` +
                    `2. Если вы планировали ручную проверку законов — самое время это сделать.\n` +
                    `3. Если всё актуально — просто закройте эту задачу.\n\n` +
                    `*Автоматическая проверка выполнена успешно*`,
              labels: ['auto-check', 'status-ok']
            });
            
            console.log('✅ Отчет создан');

      - name: Уведомление об ошибке
        if: env.SOURCE_STATUS == 'down'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const today = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Источник недоступен (${today})`,
              body: `## ❌ Критическая ошибка\n\n` +
                    `Сервис **normativ.kontur.ru** не отвечает.\n\n` +
                    `### Возможные причины:\n` +
                    `- Технические работы на стороне Контура\n` +
                    `- Временные проблемы сети\n\n` +
                    `### Что делать:\n` +
                    `1. Проверьте доступность вручную: https://normativ.kontur.ru\n` +
                    `2. Если сайт работает — возможно, это временный сбой GitHub Actions.\n` +
                    `3. Повторите запуск workflow вручную позже.\n\n` +
                    `*Автоматическое уведомление*`,
              labels: ['critical', 'source-down']
            });
            
            console.log('⚠️ Создано уведомление о недоступности');
