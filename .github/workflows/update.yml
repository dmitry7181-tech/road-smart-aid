name: 🔍 Проверка актуальности законов

on:
  schedule:
    # Каждое воскресенье в 10:00 UTC (13:00 Москва)
    - cron: '0 10 * * 0'
  workflow_dispatch: # Разрешает ручной запуск

# ⚠️ ВАЖНО: Разрешения для создания Issue
permissions:
  contents: read
  issues: write

jobs:
  check-sources:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4
      
      - name: Проверка доступности источников
        id: check
        run: |
          echo "🔍 Проверка источников нормативной базы..."
          
          # Проверяем pravo.gov.ru
          if curl -s --head --request GET --max-time 30 "https://publication.pravo.gov.ru" > /dev/null; then
            echo "✅ publication.pravo.gov.ru доступен"
            echo "PRAVO_STATUS=up" >> $GITHUB_ENV
          else
            echo "❌ publication.pravo.gov.ru недоступен"
            echo "PRAVO_STATUS=down" >> $GITHUB_ENV
          fi
          
          # Проверяем consultant.ru
          if curl -s --head --request GET --max-time 30 "https://www.consultant.ru" > /dev/null; then
            echo "✅ consultant.ru доступен"
            echo "CONSULTANT_STATUS=up" >> $GITHUB_ENV
          else
            echo "❌ consultant.ru недоступен"
            echo "CONSULTANT_STATUS=down" >> $GITHUB_ENV
          fi
      
      - name: Создание Issue для проверки
        if: env.PRAVO_STATUS == 'up'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const today = new Date().toISOString().split('T')[0];
            
            // Проверяем дубликаты
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'legal-update'
            });
            
            const duplicate = existingIssues.data.find(i => i.title.includes('Проверка актуальности законов'));
            
            if (duplicate) {
              console.log('ℹ️ Issue уже существует');
              return;
            }
            
            // Создаём Issue
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📋 Проверка актуальности законов от ${today}`,
              body: `## 🔍 Еженедельная проверка\n\n` +
                    `**Дата:** ${today}\n\n` +
                    `### ✅ Чек-лист:\n` +
                    `- [ ] Приказ МВД №264\n` +
                    `- [ ] КоАП РФ\n` +
                    `- [ ] ФЗ «О полиции»\n` +
                    `- [ ] ПДД РФ\n\n` +
                    `### 📝 Действия:\n` +
                    `1. Сверьтесь с источниками.\n` +
                    `2. Обновите \`data/legal-base.json\` при необходимости.\n` +
                    `3. Закройте это Issue.\n\n` +
                    `*Auto-generated by GitHub Actions*`,
              labels: ['legal-update']
            });
            
            console.log('✅ Issue создан');

      - name: Уведомление об ошибке
        if: env.PRAVO_STATUS == 'down'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Источники недоступны (${new Date().toISOString().split('T')[0]})`,
              body: `Сайт **pravo.gov.ru** не отвечает. Проверьте вручную.`,
              labels: ['critical']
            });
